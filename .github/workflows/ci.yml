name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Content lint, typecheck and logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The content lint is the gate: 200/200 chapter coverage, flag wiring, beat
      # reachability, canon safety, string keys, dialogue length, art references.
      - run: npm run lint:content
      - run: npm run typecheck
      - run: npm test

  browsers:
    name: Browsers (${{ matrix.engine }} · ${{ matrix.viewport }})
    runs-on: ubuntu-latest
    needs: verify
    # The default is six hours, which turns a hang into a run nobody reads. A single
    # viewport is minutes, so twenty is generous and a hang fails visibly.
    timeout-minutes: 20
    # One runner per engine and viewport, in parallel.
    #
    # All three engines in one job ran for three hours, and a three-hour signal is one
    # nobody waits for — which is how two WebKit failures stayed in the branch across
    # several pushes. Splitting by engine fixed that for Chromium (18 min) and WebKit
    # (14), but Firefox still needed more than forty for its five viewports, which put
    # it straight back in "too slow to read" and would have tripped the timeout below on
    # every run. Splitting by viewport as well makes every job 36 tests: a few minutes
    # for Chromium and WebKit, under ten for Firefox, and nothing near the limit.
    #
    # fail-fast is off, so one red combination still reports the other fourteen.
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
        viewport: [phone-390, tablet-portrait, tablet-landscape, laptop, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      # One engine at one viewport, plus the frame and download budget checks.
      - run: npx playwright test --project='${{ matrix.engine }}-${{ matrix.viewport }}'
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # One per combination: upload-artifact@v4 rejects a duplicate name, and every
          # matrix job would otherwise try to upload "playwright-report".
          name: playwright-report-${{ matrix.engine }}-${{ matrix.viewport }}
          path: playwright-report/
          retention-days: 14

  package:
    name: Static site and offline ZIP
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Nothing from source-reference/ may ever reach a shipped artifact.
      - name: Assert no source text is bundled
        run: |
          if find dist dist-offline -iname '*.pdf' -print -quit | grep -q .; then
            echo "A PDF reached the build output." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: offline-zip
          path: Qing-Mao-Rebirth-offline.zip
