name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Content lint, typecheck and logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The content lint is the gate: 200/200 chapter coverage, flag wiring, beat
      # reachability, canon safety, string keys, dialogue length, art references.
      - run: npm run lint:content
      - run: npm run typecheck
      - run: npm test

  browsers:
    name: Browsers (${{ matrix.engine }})
    runs-on: ubuntu-latest
    needs: verify
    # One runner per engine, in parallel. All three engines in one job ran for three
    # hours, and a three-hour signal is one nobody waits for — which is how two WebKit
    # failures stayed in the branch across several pushes. fail-fast is off so a WebKit
    # break still reports Firefox and Chromium instead of hiding them.
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      # Five viewports for this engine, plus the frame and download budget checks.
      - run: npx playwright test --project='${{ matrix.engine }}-*'
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # One per engine: upload-artifact@v4 rejects a duplicate name, and three
          # matrix jobs would otherwise all try to upload "playwright-report".
          name: playwright-report-${{ matrix.engine }}
          path: playwright-report/
          retention-days: 14

  package:
    name: Static site and offline ZIP
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Nothing from source-reference/ may ever reach a shipped artifact.
      - name: Assert no source text is bundled
        run: |
          if find dist dist-offline -iname '*.pdf' -print -quit | grep -q .; then
            echo "A PDF reached the build output." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: offline-zip
          path: Qing-Mao-Rebirth-offline.zip
