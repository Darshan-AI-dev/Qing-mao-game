name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/qing-mao-design-roadmap-zpygyf, main]
  workflow_dispatch:

# Pages needs these; nothing else in the repo does.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a queued one finish rather than cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The content lint and the typecheck gate the deploy, so a broken build never
      # reaches the public URL.
      - run: npm run build
      - name: Assert no source text is bundled
        run: |
          if find dist -iname '*.pdf' -print -quit | grep -q .; then
            echo "A PDF reached the build output." >&2
            exit 1
          fi
      # One-time manual step before this can succeed:
      #   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
      # `enablement: true` cannot do it for you. The workflow's token is allowed to
      # deploy to Pages but not to create the Pages site, so asking it to create one
      # fails with "Resource not accessible by integration". Leaving enablement off
      # gives the clearer "please verify that the repository has Pages enabled" error.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
